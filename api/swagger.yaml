basePath: /
definitions:
  contract.StatusCode:
    enum:
    - "000000"
    - "000001"
    - "000002"
    - "000011"
    - "000012"
    - "000013"
    - "000014"
    type: string
    x-enum-varnames:
    - StatusCodeSuccess
    - StatusCodeBindingFailed
    - StatusCodeValidationFailed
    - StatusCodeUnauthorized
    - StatusCodeUserOrPasswordInvalid
    - StatusCodeInternalServerError
    - StatusCodeSequenceError
  middleware.AuthUserData:
    properties:
      role:
        type: string
      userId:
        type: string
    type: object
  schema.RequestAdminLogin:
    properties:
      password:
        minLength: 6
        type: string
      username:
        maxLength: 255
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  schema.RequestBookCreate:
    properties:
      authUserData:
        $ref: '#/definitions/middleware.AuthUserData'
