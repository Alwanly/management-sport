    get:
      consumes:
      - application/json
      description: List audit logs (admin only)
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/wrapper.JSONResult'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/schema.ResponseAuditItem'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/wrapper.JSONResult'
      security:
      - BearerAuth: []
      summary: List audit logs
      tags:
      - Audits
  /audits/v1/{id}:
    get:
